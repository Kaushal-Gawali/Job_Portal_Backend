spring:
  application:
    name: job-portal

  datasource:
    url: jdbc:mysql://localhost:3306/jobportal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-this-in-prod-to-a-long-random-string}
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000

app:
  cors:
    allowed-origin: http://localhost:5173

  file:
    upload-dir: ./uploads/resumes
    max-size-mb: 5
